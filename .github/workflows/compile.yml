name: Scientific Python & LaTeX CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-analysis:
    name: Run Python Analysis Scripts & Verify Plots
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Scientific Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Execute All Analysis Pipelines
        run: |
          for dir in Lab-Phy-2/*; do
            if [ -d "$dir" ] && [ -f "$dir/analysis.py" ]; then
              echo "=== Running $dir/analysis.py ==="
              (cd "$dir" && python analysis.py)
            fi
          done

      - name: Verify Generated Plots
        run: |
          total_plots=$(find Lab-Phy-2/*/plots -name "*.pdf" 2>/dev/null | wc -l)
          echo "Total generated PDF plots: $total_plots"
          if [ "$total_plots" -eq 0 ]; then
            echo "Error: No plots were generated!"
            exit 1
          fi
